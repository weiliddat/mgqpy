name: Test

on:
  push:
    branches:
      - main
      - v1-base
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - compose.yml
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - compose.yml
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        mongodb: ['7', '8']
    env:
      UV_PYTHON: ${{ matrix.python }}
      MONGODB_VERSION: ${{ matrix.mongodb }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --dev

      - name: Compose up
        run: docker compose up --detach --wait

      - name: Test coverage
        run: uv run pytest --cov=mgqpy --cov-report xml

      - name: Installed wheel smoke test
        run: |
          uv build --wheel
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python "$GITHUB_WORKSPACE/tests/smoke_wheel.py"

      - name: Compose down
        if: always()
        run: docker compose down --volumes

      - name: Upload to codecov
        if: matrix.python == '3.13' && matrix.mongodb == '8'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
